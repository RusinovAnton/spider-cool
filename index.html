<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e8fe0">
  <title>Aero Spider Solitaire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Frutiger Aero sky backdrop -->
  <div id="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="aurora a1"></div>
    <div class="aurora a2"></div>
    <div class="aurora a3"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <svg class="swoosh" viewBox="0 0 1440 400" preserveAspectRatio="none">
      <defs>
        <linearGradient id="sw1" x1="0" x2="1">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff" stop-opacity=".55"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="sw2" x1="0" x2="1">
          <stop offset="0" stop-color="#9ff7ff" stop-opacity="0"/>
          <stop offset=".6" stop-color="#9ff7ff" stop-opacity=".5"/>
          <stop offset="1" stop-color="#9ff7ff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M0 260 C 360 120, 760 360, 1440 150 L1440 175 C 760 385, 360 150, 0 290 Z" fill="url(#sw1)"/>
      <path d="M0 300 C 420 200, 900 380, 1440 230 L1440 240 C 900 395, 420 215, 0 312 Z" fill="url(#sw2)"/>
    </svg>
    <svg class="hills" viewBox="0 0 1440 320" preserveAspectRatio="none">
      <defs>
        <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9be84a"/>
          <stop offset="1" stop-color="#2f9a1f"/>
        </linearGradient>
        <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#c6f76a"/>
          <stop offset=".45" stop-color="#5fc92b"/>
          <stop offset="1" stop-color="#1f7a14"/>
        </linearGradient>
      </defs>
      <path d="M0 170 C 260 70, 520 90, 760 160 S 1220 90, 1440 130 L1440 320 L0 320 Z" fill="url(#h1)" opacity=".85"/>
      <path d="M0 230 C 300 140, 640 170, 900 220 S 1300 170, 1440 200 L1440 320 L0 320 Z" fill="url(#h2)"/>
      <path d="M0 232 C 300 142, 640 172, 900 222 S 1300 172, 1440 202" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="3"/>
    </svg>
    <canvas id="bubbles"></canvas>
  </div>

  <div id="app">
    <header id="topbar" class="glass">
      <div id="mascot-wrap">
        <button id="mascot" class="user-tile" aria-label="Webby the spider"></button>
        <div class="mascot-name">Webby</div>
      </div>
      <div id="speech" class="speech" role="status" aria-live="polite"><span class="speech-text"></span></div>

      <div class="hud">
        <div class="hud-item"><span class="lbl">Score</span><span class="val" id="hud-score">500</span></div>
        <div class="hud-item"><span class="lbl">Moves</span><span class="val" id="hud-moves">0</span></div>
        <div class="hud-item"><span class="lbl">Time</span><span class="val" id="hud-time">0:00</span></div>
        <div class="hud-item best"><span class="lbl" id="hud-mode">1 Suit · Best</span><span class="val" id="hud-best">—</span></div>
      </div>

      <nav class="buttons">
        <button class="aero-btn green" id="btn-new" title="New game (N)">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New</span>
        </button>
        <button class="aero-btn" id="btn-undo" title="Undo last move (Ctrl+Z) — one step, not after a card turns up">
          <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span>Undo</span>
        </button>
        <button class="aero-btn" id="btn-hint" title="Hint (H) — or click the table">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7V16h8v-1.3A7 7 0 0 0 12 2z"/></svg><span>Hint</span>
        </button>
        <button class="aero-btn" id="btn-stats" title="Stats & history">
          <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Stats</span>
        </button>
        <button class="aero-btn round" id="btn-sound" title="Sound (M)" aria-pressed="true">
          <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
          <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
        </button>
      </nav>
    </header>

    <main id="board" aria-label="Spider solitaire table"></main>
  </div>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="modal-root"></div>

  <script src="js/audio.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/mascot.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
